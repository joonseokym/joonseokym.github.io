# Site settings
title: "Joonseo Kym's Resume"
description: "The resume of Joonseo Kym, an undergraduate student at KAIST."
url: "https://joonseokym.github.io" # the base hostname & protocol for your site, e.g. https://example.github.io
baseurl: "" # the subpath of your site, e.g. /blog
