# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true

# Resume settings
resume_avatar: "true"
resume_name: "Joonseo Kym"
resume_title: "Undergraduate Student<br>@ Dep. of Mechanical Engineering<br>& Electrical Engineering, KAIST"

# used for the contact button in _layouts/resume.html
resume_contact_email: "joonseo@kaist.ac.kr"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_address: "Daejeon, South Korea"

resume_header_contact_info: "Daejeon, South Korea • joonseo@kaist.ac.kr"
display_header_contact_info: "false"

resume_header_intro: "<p>
  I'm an undergraduate in Mechanical and Electrical Engineering at KAIST who builds robotic hardware end to end, from mechanism design and fabrication to sensing, data acquisition, and control.
  <br><br>
  I started with mechanisms. In high school I designed a cat-inspired shock-absorbing landing gear for drones, then a wearable twisted-string actuator for elbow rehabilitation. The actuator became a registered patent and earned a Fourth Award at Regeneron ISEF. At KAIST's Exoskeleton Lab I moved into sensing: I built pneumatic mechanomyography (pMMG) sensors and their data acquisition systems, and I now lead a first-author study on where to place pMMG sensors to estimate knee extensor torque. Along the way I built mechatronic systems such as an automatic shuttlecock-sorting sweeper, and I explored deep reinforcement learning for control.
  <br><br>
  Next, I want to connect these three pieces (mechanism, sensing, and learning-based control) to build dynamic robots, especially legged and wearable systems. To get there, I'm deepening my skills in embedded electronics, PCB design, and reinforcement learning.
</p>"

