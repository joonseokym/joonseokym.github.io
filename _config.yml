# Site settings
title: "Joonseo Kym's Resume"
description: "Mechanical & Electrical Engineering at KAIST. Robotic hardware, mechanism design, and wearable sensing."
url: "https://joonseokym.com" # the base hostname & protocol for your site, e.g. https://example.github.io
baseurl: "" # the subpath of your site, e.g. /blog
og_image: "/_assets/photos/og-image-2026.png" # 공유 시 나타날 기본 이미지 경로

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true

# Resume settings
resume_avatar: "true"
resume_name: "Joonseo Kym"
resume_title: "Undergraduate in Mechanical & Electrical Engineering, KAIST"

# used for the contact button in _layouts/resume.html
resume_contact_email: "joonseo@kaist.ac.kr"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_address: "Daejeon, South Korea"

resume_header_contact_info: "Daejeon, South Korea • joonseo@kaist.ac.kr"
display_header_contact_info: "false"

resume_header_intro: "<p>
  I build robotic hardware end to end, from mechanism design and fabrication to sensing, data acquisition, and control.
  <br><br>
  I started with mechanisms, including a <a href='/2021/04/01/twisted-string-cpm.html'>wearable twisted-string actuator</a> that became a <a href='https://patents.google.com/patent/KR102635233B1/en' target='_blank' rel='noopener'>registered patent</a> and won a Fourth Award at Regeneron ISEF. At KAIST's Exoskeleton Lab I moved into wearable sensing, and I now lead a <a href='/2024/12/02/pmmg-sensor.html'>first-author study on pMMG sensor placement</a> for knee extension torque analysis.
  <br><br>
  Next, I'm starting an individual research project on robot hardware design at the RAI Lab.
</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work: "yes"
# CV Download Link
resume_cv_url: "/_assets/pdf/Joonseo_Kym_CV.pdf"

# Decide which sections to use
