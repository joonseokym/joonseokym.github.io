# ---------------------------------------------------------------
# Site
# ---------------------------------------------------------------
title: "Joonseo Kym's Resume"
description: "Mechanical & Electrical Engineering at KAIST. Robotic hardware, mechanism design, and wearable sensing."
url: "https://joonseokym.com"
baseurl: ""
og_image: "/assets/images/og-image-2026.png"   # link preview image (rename the file to force a refresh)

# ---------------------------------------------------------------
# Build (restart `jekyll serve` after editing this file)
# ---------------------------------------------------------------
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
plugins:
  - jekyll-sitemap
exclude:          # repo-only files that should not be published
  - README.md
  - LICENSE
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - .ruby-version

# ---------------------------------------------------------------
# Header
# ---------------------------------------------------------------
resume_name: "Joonseo Kym"
resume_title: "Undergraduate in Mechanical & Electrical Engineering, KAIST"
resume_avatar: "true"
resume_contact_address: "Daejeon, South Korea"   # schema.org metadata only
resume_cv_url: "/assets/cv/Joonseo_Kym_CV.pdf"
resume_looking_for_work: "yes"                     # "yes" shows the Contact me button

resume_header_intro: "<p>
  I build robotic hardware end to end, from mechanism design and fabrication to sensing, data acquisition, and control.
  <br><br>
  I started with mechanisms, including a <a href='/2021/04/01/twisted-string-cpm.html'>wearable twisted-string actuator</a> that became a <a href='https://patents.google.com/patent/KR102635233B1/en' target='_blank' rel='noopener'>registered patent</a> and won a Fourth Award at Regeneron ISEF. At KAIST's Exoskeleton Lab I moved into wearable sensing, and I now lead a <a href='/2024/12/02/pmmg-sensor.html'>first-author study on pMMG sensor placement</a> for knee extension torque analysis.
  <br><br>
  Next, I'm starting an individual research project on robot hardware design at KAIST's <a href='https://railab.kaist.ac.kr/' target='_blank' rel='noopener'>Robotics and Artificial Intelligence Lab</a> (Prof. Jemin Hwangbo), which designs and builds its own legged robots such as RAIBO.
</p>"

# ---------------------------------------------------------------
# Sections (comment out a line to hide that section)
# ---------------------------------------------------------------
resume_section_education: true
resume_section_experience: true
resume_section_projects: true
resume_section_patents: true
resume_section_recognition: true
resume_section_military: true
resume_section_associations: true
resume_section_skills: true
# resume_section_interests: true

# ---------------------------------------------------------------
# Social links (GitHub, LinkedIn, and Instagram are supported)
# ---------------------------------------------------------------
resume_social_links:
  resume_github_url: "https://github.com/joonseokym"
  resume_linkedin_url: "https://www.linkedin.com/in/joonseokym/"
  # resume_instagram_url: "https://www.instagram.com/ssemiwest/"
resume_print_social_links: true

# ---------------------------------------------------------------
# Theme
# ---------------------------------------------------------------
resume_theme: default
