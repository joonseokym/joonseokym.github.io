<!DOCTYPE html>
<html lang="en">
  {% include head.html %}

  <style>
    .post-nav {
      border-bottom: 1px solid #e3e6eb;
      font-size: 14px;
    }
    .post-nav .wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      max-width: 760px;
    }
    .post-nav .site-name { font-weight: 600; color: #1a1a1a; }
    .post-nav .back-link { color: #555; }
    .post-nav .back-link:hover { color: #2f5d8a; }

    .post-wrapper {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 24px 32px;
    }

    .post-header {
      margin-bottom: 40px;
      padding-bottom: 28px;
      border-bottom: 1px solid #e3e6eb;
    }
    .post-eyebrow {
      font-size: 14px;
      font-weight: 500;
      color: #2f5d8a;
      margin: 0 0 10px;
    }
    .post-title {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #1a1a1a;
      margin: 0;
    }

    .post-content {
      font-size: 17px;
      line-height: 1.75;
      color: #2a2a2a;
    }
    .post-content p { margin: 0 0 20px; }
    .post-content h3 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #1a1a1a;
      margin: 44px 0 12px;
    }
    .post-content h3:first-child { margin-top: 0; }
    .post-content h4 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin: 32px 0 8px;
    }
    .post-content hr {
      border: none;
      border-top: 1px solid #e3e6eb;
      margin: 40px 0;
    }
    .post-content ul { padding-left: 1.2em; margin: 0 0 20px; }
    .post-content li { margin: 6px 0; }
    .post-content li::marker { color: #a0a6b0; }
    .post-content strong { font-weight: 600; color: #1a1a1a; }
    .post-content img { max-width: 100%; }
    .post-content video { max-width: 100%; }
    .post-content blockquote {
      margin: 32px 0;
      padding: 4px 0 4px 20px;
      border-left: 3px solid #cfd8e3;
      color: #555;
    }

    .post-footer {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 24px 64px;
    }

    @media (max-width: 600px) {
      .post-wrapper { padding-top: 36px; }
      .post-title { font-size: 28px; }
      .post-content { font-size: 16px; }
      .post-content div[style*="display: flex"] { flex-direction: column; }
      .post-content div[style*="display: flex"] > img,
      .post-content div[style*="display: flex"] > video { width: 100% !important; height: auto !important; }
    }
  </style>

  <body>
    <nav class="post-nav">
      <div class="wrapper">
        <a href="{{ '/' | relative_url }}" class="site-name">{{ site.resume_name }}</a>
        <a href="{{ '/' | relative_url }}#projects" class="back-link">← All projects</a>
      </div>
    </nav>

    <div class="post-wrapper">
      {% if page.title != "Posts" %}
      <header class="post-header">
        <p class="post-eyebrow">Research project</p>
        <h1 class="post-title">{{ page.title }}</h1>
      </header>
      {% else %}
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
      </header>
      {% endif %}

      <article class="post-content">{{ content }}</article>
    </div>

    <footer class="post-footer">
      <a href="{{ '/' | relative_url }}" class="btn btn-secondary">← Back to resume</a>
    </footer>
  </body>
</html>
